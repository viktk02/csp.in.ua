<script nonce="{{ nonce }}">

  });
</script>

<script nonce="{{ nonce }}">
  const canvas = document.getElementById('background');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const isMobile = window.innerWidth <= 768;
  const squareCount = isMobile ? 10: 25;
  const squares = [];
  const minDistance = 200;

  class Oscillator {
    constructor() {
      this.amplitude = 1.5;
      this.frequency = 0.00001 + Math.random() * 0.00001;
      this.phase = Math.random() * Math.PI * 2;
    }

    update() {
      return Math.sin(Date.now() * this.frequency + this.phase) * this.amplitude;
    }
  }

  for (let i = 0; i < squareCount; i++) {
    let attempts = 0;
    let newSquare;

    do {
      newSquare = {
        x: Math.random() * (width - 200),
        y: Math.random() * (height - 200),
        size: isMobile ? 80 + Math.random() * 40 : 120 + Math.random() * 80,
        dx: (Math.random() - 0.5) * 0.5,
        oscillator: new Oscillator(),
        color: `rgba(0, 0, 255, ${0.5 + Math.random() * 0.3})`,
        baseY: 0
      };
      attempts++;
      if (attempts > 100) break;
    } while (squares.length > 0 && !isFarEnough(newSquare, squares));

    newSquare.baseY = newSquare.y;
    squares.push(newSquare);
  }

  function isFarEnough(newSquare, existingSquares) {
    return existingSquares.every(sq => {
      const dx = sq.x - newSquare.x;
      const dy = sq.y - newSquare.y;
      return Math.sqrt(dx * dx + dy * dy) > minDistance;
    });
  }

  function drawRoundedSquare(x, y, size, radius, color) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + size - radius, y);
    ctx.quadraticCurveTo(x + size, y, x + size, y + radius);
    ctx.lineTo(x + size, y + size - radius);
    ctx.quadraticCurveTo(x + size, y + size, x + size - radius, y + size);
    ctx.lineTo(x + radius, y + size);
    ctx.quadraticCurveTo(x, y + size, x, y + size - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = color;
    ctx.fill();
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);

    for (let square of squares) {
      square.x += square.dx;

      square.y = square.baseY + square.oscillator.update() * 50;

      if (square.x < 0 || square.x > width - square.size) {
        square.dx *= -0.8;
        square.x = Math.max(0, Math.min(width - square.size, square.x));
      }

      if (square.y < -square.size || square.y > height) {
        square.baseY = Math.random() * height;
      }

      drawRoundedSquare(square.x, square.y, square.size, square.size * 0.15, square.color);
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>
<div id="imageModal" class="global-modal">

<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js" nonce="{{ nonce }}"></script>
<script nonce="{{ nonce }}">
  const swiperSettings = {
    loop: true,
    slidesPerView: 2,
    spaceBetween: 40,
    autoplay: {
      delay: 3000,
      disableOnInteraction: false,
    },
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
    },
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev",
    },
    breakpoints: {
      768: {
        slidesPerView: 4,
      }
    }
  };

  new Swiper(".photo-swiper", {
    loop: true,
    autoplay: {
      delay: 3500,
      disableOnInteraction: false,
    },
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
    },
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev",
    },
  });

  new Swiper(".partner-top-swiper", swiperSettings);
  new Swiper(".partner-bottom-swiper", swiperSettings);
</script>
